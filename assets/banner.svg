<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Osunhive WhatsApp Chatbot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0d1b16"/>
      <stop offset="100%" stop-color="#07120c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#25D366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- circuit / code motif -->
  <g stroke="#25D366" stroke-opacity="0.16" stroke-width="1.5" fill="none">
    <path d="M0 60 H300 V120 H520"/>
    <path d="M1280 340 H980 V280 H760"/>
    <path d="M60 400 V300 H240 V220"/>
    <path d="M1220 0 V120 H1040 V200"/>
  </g>
  <g fill="#25D366" fill-opacity="0.55">
    <circle cx="300" cy="120" r="4"/><circle cx="520" cy="120" r="4"/>
    <circle cx="980" cy="280" r="4"/><circle cx="760" cy="280" r="4"/>
    <circle cx="240" cy="220" r="4"/><circle cx="1040" cy="200" r="4"/>
  </g>

  <!-- code lines -->
  <g font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#7ee2a8" fill-opacity="0.5">
    <text x="70" y="300">const bot = new Osunhive();</text>
    <text x="70" y="322">bot.on(&quot;message&quot;, reply);</text>
    <text x="950" y="90">.menu  .autoreply</text>
    <text x="950" y="112">.voice  .status</text>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="640" y="180" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="1">OSUNHIVE</text>
    <text x="640" y="238" font-size="40" font-weight="600" fill="url(#accent)">WhatsApp Chatbot</text>
    <text x="640" y="282" font-size="20" fill="#9adbb5">Learn • Grow • Innovate • Earn</text>
  </g>

  <!-- footer -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="1240" y="372" text-anchor="end" font-size="16" fill="#5f8f76">osunhive.name.ng</text>
    <text x="40" y="372" font-size="16" fill="#5f8f76">github.com/osunhive</text>
  </g>

  <rect x="0" y="396" width="1280" height="4" fill="url(#accent)"/>
</svg>
