version: 2
updates:
  # npm dependencies: patch releases only.
  # Major/minor bumps need a human — e.g. node-fetch 3 is ESM-only and breaks
  # `require()`, jsdom 22→31 and awesome-phonenumber 5→7 are breaking.
  # Security updates are not affected by `ignore` and still open PRs.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - patch

  # GitHub Actions: monthly, all releases. Action majors are usually just a
  # Node-runtime bump and keep the workflows free of deprecation warnings.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions