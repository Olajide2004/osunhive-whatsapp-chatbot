name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Syntax check
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then echo "::error file=$f::Syntax error"; fail=1; fi
          done < <(git ls-files '*.js')
          exit $fail

      - name: Offline test suites
        run: node scripts/run-tests.js

  package:
    name: Source package leak scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source archive
        run: |
          git archive --format=zip -o /tmp/release.zip HEAD
          unzip -l /tmp/release.zip > /tmp/list.txt
          echo "Archive entries: $(tail -n +4 /tmp/list.txt | wc -l)"

      - name: Fail on leaked secrets / runtime state
        run: |
          if grep -E 'session/|node_modules/|baileys_store|cdnCache|cdnState|messageCount\.json|premium\.json|userName\.json|(^|/)\.env$' /tmp/list.txt; then
            echo "::error::Release archive contains runtime or secret files"
            exit 1
          fi
          echo "Leak scan CLEAN"